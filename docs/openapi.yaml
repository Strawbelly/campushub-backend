openapi: 3.0.3

info:
  title: CampusHub Reservation API
  description: API specification for managing campus resources and time-slotted reservations.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Local Development Server

paths:
  /resources:
    get:
      summary: List all resources
      description: Returns all campus resources, optionally filtered by resource type.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter resources by resource type.
          schema:
            type: string
      responses:
        '200':
          description: A list of campus resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
        '400':
          description: The type query parameter was provided but is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /reservations:
    post:
      summary: Create a new reservation
      description: Creates a time-slotted reservation for a campus resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
      responses:
        '201':
          description: Reservation created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'

        '409':
          description: The requested resource is already reserved for the requested time period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/user/{userId}:
    get:
      summary: Get active reservations for a user
      description: Returns all active reservations for the specified student.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the student.
          schema:
            type: string
      responses:
        '200':
          description: A list of active reservations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'

components:
  schemas:

    Resource:
      type: object
      required:
        - id
        - name
        - type
        - location
        - isAvailable
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - ROOM
            - EQUIPMENT
            - LAB
        location:
          type: string
        isAvailable:
          type: boolean

    Reservation:
      type: object
      required:
        - id
        - resourceId
        - userId
        - startTime
        - endTime
        - status
      properties:
        id:
          type: string
        resourceId:
          type: string
        userId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string