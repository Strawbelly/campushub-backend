openapi: 3.0.3

info:
  title: CampusHub Reservation API
  description: API specification for managing campus resources and time-slotted reservations.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Local Development Server

paths:
  /resources:
    get:
      summary: List all resources
      description: Returns all campus resources, optionally filtered by resource type and availability.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter resources by resource type.
          schema:
            type: string
            enum:
              - ROOM
              - EQUIPMENT
              - LAB
        - name: isAvailable
          in: query
          required: false
          description: Filter resources by availability.
          schema:
            type: boolean
      responses:
        '200':
          description: A list of campus resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
        '400':
          description: The type or isAvailable query parameter has an invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /reservations:
    post:
      summary: Create a new reservation
      description: Creates a time-slotted reservation for a campus resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
      responses:
        '201':
          description: Reservation created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'

        '409':
          description: The requested resource is already reserved for the requested time period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/user/{userId}:
    get:
      summary: Get all reservations for a user
      description: Returns all reservations for the specified student, in any status.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the student.
          schema:
            type: string
      responses:
        '200':
          description: A list of the student's reservations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'

  /reservations/{id}/confirm:
    patch:
      summary: Confirm a reservation
      description: Transitions the reservation status from PENDING to CONFIRMED.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the reservation.
          schema:
            type: string
      responses:
        '200':
          description: The updated reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: The id is not a valid reservation id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No reservation exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The reservation's current status does not allow this transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/{id}/cancel:
    patch:
      summary: Cancel a reservation
      description: Transitions the reservation status from PENDING or CONFIRMED to CANCELLED. A cancelled reservation no longer blocks its time slot.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the reservation.
          schema:
            type: string
      responses:
        '200':
          description: The updated reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: The id is not a valid reservation id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No reservation exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The reservation's current status does not allow this transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    Resource:
      type: object
      required:
        - id
        - name
        - type
        - location
        - isAvailable
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - ROOM
            - EQUIPMENT
            - LAB
        location:
          type: string
        isAvailable:
          type: boolean

    Reservation:
      type: object
      required:
        - id
        - resourceId
        - userId
        - startTime
        - endTime
        - status
      properties:
        id:
          type: string
        resourceId:
          type: string
        userId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string