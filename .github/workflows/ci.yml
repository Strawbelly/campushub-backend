name: CampusHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      jest_outcome: ${{ steps.jest.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload Jest failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-test-results
          path: test-results.log
          if-no-files-found: ignore

  auto-fix:
    needs: test
    if: failure() && needs.test.outputs.jest_outcome == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Jest failure log
        uses: actions/download-artifact@v4
        with:
          name: jest-test-results

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Parse the attached Jest failure log. Locate the source code causing the failure in src/ and generate a patch that fixes the bug without breaking existing tests.

            Read test-results.log and inspect the relevant source files under src/.
            Modify only source files under src/.
            Do not modify tests, configuration files, package files, or workflow files.
            Do not commit, push, or create a pull request.
            Leave the generated source-code changes in the working directory for the workflow to validate.

      - name: Verify generated fix
        run: |
          npm run lint
          npm test

      - name: Create fix branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BRANCH_NAME: fix/auto-heal-${{ github.run_id }}
        run: |
          set -e

          if [ -z "$(git status --porcelain)" ]; then
            echo "Claude did not generate any changes."
            exit 1
          fi

          if git status --porcelain | grep -vE '^[ MARCUD?!]{2} src/'; then
            echo "Unexpected changes outside src/. Stopping."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add src/
          git commit -m "fix: auto-heal Jest test failure"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "fix: auto-heal Jest test failure" \
            --body "## Automated Fix

            This PR was generated by Claude Code after a Jest test failure.

            ## Audit Log
            - Captured Jest failure output in test-results.log.
            - Passed the failure log and source context to Claude Code.
            - Generated changes were restricted to src/.
            - Ran lint and Jest again to validate the fix.

            Please review the source-code changes before merging."